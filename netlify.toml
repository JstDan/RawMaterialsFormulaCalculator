# Netlify deployment for the Nutrikal Formula Calculator (Vite single-page app).
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Site configuration → Environment variables
# (they are read at build time). Without them the site runs in local demo mode – see README.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Demo mode only: Google Sheet download for the in-browser sync (see netlify/functions/gsheet.mts).
[[redirects]]
  from = "/gsheet/spreadsheets/d/:id/export"
  to = "/.netlify/functions/gsheet?id=:id"
  status = 200
  force = true

# Single-page app: every route (/offers, /materials, …) is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Internal tool: keep it out of search engines.
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fingerprinted build assets never change – cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
